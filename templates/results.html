<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classification Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="results">
    <h1>Complaint Classification Results</h1>
    <table>
        <tr>
            <th>Complaint</th>
            <th>Category</th>
        </tr>
        {% for result in results %}
        <tr>
            <td>{{ result.feedback }}</td>
            <td>{{ result.category }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
